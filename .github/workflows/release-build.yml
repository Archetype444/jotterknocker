name: Build and verify jotterknocker

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '.github/workflows/release-build.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jotterknocker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Layout contract, unit tests and lint
        run: |
          python scripts/check-fork-layout.py
          bash gradlew testDebugUnitTest lintDebug lintRelease assembleDebug assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-and-lint-results
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            resolution: 1080x1920
            density: 420
            font: '1.0'
          - api: 30
            resolution: 1080x1920
            density: 420
            font: '1.0'
          - api: 35
            resolution: 1768x2208
            density: 420
            font: '1.35'
          - api: 36
            resolution: 1080x1920
            density: 420
            font: '1.0'
          - api: 28
            resolution: 480x800
            density: 240
            font: '1.0'
            test_class: app.olauncher.CompactHomeLayoutTest,app.olauncher.NotificationShadeTest,app.olauncher.TopEdgeServiceTest
          - api: 30
            resolution: 480x800
            density: 160
            font: '1.0'
            test_class: app.olauncher.CompactHomeLayoutTest,app.olauncher.NotificationShadeTest,app.olauncher.TopEdgeServiceTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Android SDK and KVM
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -memory 2048 -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-emulator-tests.sh ${{ matrix.api }} ${{ matrix.resolution }} ${{ matrix.density }} ${{ matrix.font }} '${{ matrix.test_class }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-api-${{ matrix.api }}-${{ matrix.resolution }}-${{ matrix.density }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            preview-api-*.png
            compact-preview-api-*.png
            emulator-logcat.txt
            notification-preview-api-*.png
            fossify-*.png
          retention-days: 14

  fossify-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Android SDK and KVM
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download official Fossify Calendar 1.12.1
        run: |
          curl --fail --location --retry 2 -o fossify-calendar.apk https://github.com/FossifyOrg/Calendar/releases/download/1.12.1/calendar-24-foss-release.apk
          echo 'dae815ce83285facf9fd8648b8c4f039700d95126325db124521eba479b270ba  fossify-calendar.apk' | sha256sum --check
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 2048 -noaudio -no-boot-anim -camera-back none
          script: bash scripts/test-fossify-calendar.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fossify-calendar-integration
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            fossify-*.png
            fossify-*.xml
            emulator-logcat.txt
          retention-days: 14

  build-release:
    needs: [unit-and-lint, emulator-tests, fossify-calendar]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the validated release
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          bash gradlew assembleRelease --no-daemon
          mkdir -p release-build
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-build/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-build/
          git rev-parse HEAD > release-build/source-commit.txt
          sha256sum release-build/app-release-unsigned.apk > release-build/unsigned-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jotterknocker-release-build
          path: release-build/
          retention-days: 14
          if-no-files-found: error
